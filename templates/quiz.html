<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('lessons') }}">‹ Back to Lessons</a>
    </div>
  </nav>

  <section class="quiz-container d-flex align-items-center justify-content-center">
    <div class="flashcard" id="flashcard">
      <div class="front">
        <!-- Question will go here -->
      </div>
      <div class="back">
        <!-- Answer will go here -->
      </div>
    </div>
  </section>

  <div class="quiz-controls text-center mt-4">
    <button id="prevBtn" class="btn btn-secondary me-2">Previous</button>
    <button id="flipBtn" class="btn btn-primary me-2">Flip</button>
    <button id="nextBtn" class="btn btn-secondary">Next</button>
  </div>

  <script>
    // Pass the cards data into JS
    const cards = {{ cards_json|safe }};
  </script>
  <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    defer></script>
</body>
</html>
